name: MergeMind Conflict Check

"on":
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Target/base branch"
        required: true
        default: "main"
        type: string
      head_ref:
        description: "Incoming/source branch"
        required: true
        default: "dev-a"
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: mergemind-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mergemind-check:
    name: Analyze semantic merge conflicts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install latest MergeMind
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --force-reinstall \
            "git+https://github.com/SaaranshJohri/Autonomous-Multi-Agent-Merge-Auditor-Execution-Sequence-Verifier.git@main"

          python -m pip show mergemind
          mergemind --help

      - name: Prepare pull request references
        if: github.event_name == 'pull_request_target'
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eux

          echo "Pull request: #${PR_NUMBER}"
          echo "Target branch: ${BASE_BRANCH}"
          echo "Incoming commit: ${HEAD_SHA}"

          git fetch origin \
            "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"

          git fetch origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"

          git cat-file -e "origin/${BASE_BRANCH}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"

          echo "Target branch commit:"
          git log -1 --oneline "origin/${BASE_BRANCH}"

          echo "Incoming commit:"
          git log -1 --oneline "${HEAD_SHA}"

          echo "Changed files:"
          git diff --name-status "origin/${BASE_BRANCH}...${HEAD_SHA}"

      - name: Prepare manual comparison
        if: github.event_name == 'workflow_dispatch'
        env:
          BASE_BRANCH: ${{ inputs.base_ref }}
          HEAD_BRANCH: ${{ inputs.head_ref }}
        run: |
          set -eux

          git fetch origin \
            "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"

          git fetch origin \
            "+refs/heads/${HEAD_BRANCH}:refs/remotes/origin/${HEAD_BRANCH}"

          git cat-file -e "origin/${BASE_BRANCH}^{commit}"
          git cat-file -e "origin/${HEAD_BRANCH}^{commit}"

          echo "Base branch: ${BASE_BRANCH}"
          echo "Incoming branch: ${HEAD_BRANCH}"

          git diff --name-status \
            "origin/${BASE_BRANCH}...origin/${HEAD_BRANCH}"

      - name: Analyze pull request
        if: github.event_name == 'pull_request_target'
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eux

          mergemind check \
            --base "origin/${BASE_BRANCH}" \
            --head "${HEAD_SHA}" \
            --fail-on-conflict

      - name: Analyze manually selected branches
        if: github.event_name == 'workflow_dispatch'
        env:
          BASE_BRANCH: ${{ inputs.base_ref }}
          HEAD_BRANCH: ${{ inputs.head_ref }}
        run: |
          set -eux

          mergemind check \
            --base "origin/${BASE_BRANCH}" \
            --head "origin/${HEAD_BRANCH}" \
            --fail-on-conflict
