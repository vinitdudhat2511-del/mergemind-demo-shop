name: MergeMind Conflict Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  mergemind-check:
    name: Analyze merge conflicts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MergeMind needs full history to find the merge base

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MergeMind
        run: python -m pip install "git+https://github.com/SaaranshJohri/Autonomous-Multi-Agent-Merge-Auditor-Execution-Sequence-Verifier.git"

      - name: Analyze pull request
        if: github.event_name == 'pull_request'
        run: |
          mergemind check \
            --base "origin/${{ github.base_ref }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --fail-on-conflict

      - name: Analyze current branch manually
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch origin
          mergemind check \
            --base "origin/main" \
            --head HEAD \
            --fail-on-conflict
